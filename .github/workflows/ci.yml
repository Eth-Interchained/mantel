name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: typecheck · unit · live-api · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # mantel embeds the NEDB engine in-process — there is NO daemon to
      # stand up. Every suite opens the real native addon in a scratch data
      # dir, so the whole test story is just "run the tests". No services.
      - name: Unit tests (embedded engine, fit, identity, nql, importer)
        run: npm test

      - name: Live API tests (real app, real embedded engine, no mocks)
        run: npm run test:api

      - name: Build
        run: npm run build
